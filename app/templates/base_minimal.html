<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SDLL{% endblock %} - South Durham Little League</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        .btn-primary {
            background-color: rgb(34, 139, 34);
            color: white;
        }
        .btn-primary:hover {
            background-color: rgb(28, 120, 28);
        }
        .btn-outline {
            background-color: white;
            color: rgb(34, 139, 34);
            border: 1px solid rgb(34, 139, 34);
        }
        .btn-outline:hover {
            background-color: rgba(34, 139, 34, 0.05);
        }

        /* Form elements */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-control:focus {
            outline: none;
            border-color: rgb(34, 139, 34);
            box-shadow: 0 0 0 2px rgba(34, 139, 34, 0.1);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* Links */
        a {
            color: rgb(34, 139, 34);
        }
        a:hover {
            text-decoration: underline;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
