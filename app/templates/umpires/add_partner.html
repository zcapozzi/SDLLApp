{% extends "base.html" %}

{% block title %}Add Partner{% endblock %}

{% block content %}
<div style="margin-bottom: 30px;">
    <a href="{{ url_for('umpires.partners') }}">&larr; Back to Partners</a>
</div>

<h1>Add Umpire Partner</h1>

<div class="card">
    <form method="POST">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
            <div class="form-group">
                <label for="name">Organization Name <span style="color: #c33;">*</span></label>
                <input type="text" name="name" id="name" class="form-control"
                       placeholder="e.g., Diamond Sports Officials" required>
            </div>

            <div class="form-group">
                <label for="short_code">Short Code <span style="color: #c33;">*</span></label>
                <input type="text" name="short_code" id="short_code" class="form-control"
                       placeholder="e.g., DIAMOND" maxlength="20" required
                       style="text-transform: uppercase;">
                <p style="font-size: 12px; color: var(--text-muted);">
                    Used in reports and exports
                </p>
            </div>
        </div>

        <hr style="margin: 20px 0;">
        <h3>Contact Information</h3>

        <div class="form-group">
            <label for="contact_name">Contact Name</label>
            <input type="text" name="contact_name" id="contact_name" class="form-control"
                   placeholder="Primary contact person">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label for="contact_email">Contact Email</label>
                <input type="email" name="contact_email" id="contact_email" class="form-control"
                       placeholder="email@example.com">
            </div>

            <div class="form-group">
                <label for="contact_phone">Contact Phone</label>
                <input type="tel" name="contact_phone" id="contact_phone" class="form-control"
                       placeholder="(555) 123-4567">
            </div>
        </div>

        <hr style="margin: 20px 0;">

        <div class="form-group">
            <label for="notification_preference">Notification Preference</label>
            <select name="notification_preference" id="notification_preference" class="form-control" style="width: auto;">
                <option value="weekly">Weekly Summary</option>
                <option value="daily">Daily Updates</option>
                <option value="realtime">Real-time (each assignment)</option>
                <option value="none">No notifications</option>
            </select>
            <p style="font-size: 12px; color: var(--text-muted);">
                How often to send game assignment notifications
            </p>
        </div>

        <hr style="margin: 20px 0;">

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">Add Partner</button>
            <a href="{{ url_for('umpires.partners') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
