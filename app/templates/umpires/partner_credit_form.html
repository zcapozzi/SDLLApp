{% extends "base.html" %}

{% block title %}Add Credit{% endblock %}

{% block content %}
<div style="margin-bottom: 30px;">
    <a href="{{ url_for('umpires.partner_credits') }}">&larr; Back to Credits</a>
</div>

<h1>Add Partner Credit</h1>

<p style="color: var(--text-muted); margin-bottom: 20px;">
    Manually create a credit adjustment. For postponed game credits, use the rainout wizard instead.
</p>

<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group">
                <label for="partner_id">Partner <span style="color: #c33;">*</span></label>
                <select name="partner_id" id="partner_id" class="form-control" required>
                    <option value="">Select Partner...</option>
                    {% for partner in partners %}
                    <option value="{{ partner.id }}">{{ partner.name }} ({{ partner.short_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="source_type">Credit Type <span style="color: #c33;">*</span></label>
                <select name="source_type" id="source_type" class="form-control" required>
                    <option value="adjustment">Manual Adjustment</option>
                    <option value="overpayment">Overpayment</option>
                    <option value="unfulfilled">Unfulfilled Assignment</option>
                    <option value="postponed_game">Postponed Game</option>
                </select>
            </div>
            <div class="form-group">
                <label for="amount">Amount ($) <span style="color: #c33;">*</span></label>
                <input type="number" name="amount" id="amount" class="form-control"
                       step="0.01" min="0" required placeholder="0.00">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group">
                <label for="umpire_games">Umpire-Games (optional)</label>
                <input type="number" name="umpire_games" id="umpire_games" class="form-control"
                       min="0" placeholder="e.g., 2">
                <p style="font-size: 11px; color: var(--text-muted);">Number of umpire assignments if applicable</p>
            </div>
            <div class="form-group">
                <label for="org_season_id">Season (optional)</label>
                <select name="org_season_id" id="org_season_id" class="form-control">
                    <option value="">No Season</option>
                    {% for s in seasons %}
                    <option value="{{ s.ID }}"
                            {% if current_season and current_season.ID == s.ID %}selected{% endif %}>
                        {{ s.season_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div></div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" name="description" id="description" class="form-control"
                   placeholder="Brief description of this credit..."
                   maxlength="255">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Create Credit</button>
            <a href="{{ url_for('umpires.partner_credits') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
