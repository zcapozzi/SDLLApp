<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tell Us About Yourself - SDLL Umpire Academy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, rgb(34, 139, 34) 0%, rgb(28, 112, 28) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 550px;
            width: 100%;
            padding: 40px;
        }
        .logo {
            width: 70px;
            height: 70px;
            background: rgb(34, 139, 34);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgb(34, 139, 34);
            box-shadow: 0 0 0 3px rgba(34, 139, 34, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .optional {
            color: #999;
            font-weight: normal;
            font-size: 11px;
        }
        .required::after {
            content: ' *';
            color: #dc3545;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-primary {
            background: rgb(34, 139, 34);
            color: white;
        }
        .btn-primary:hover {
            background: rgb(28, 112, 28);
            transform: translateY(-1px);
        }
        .errors {
            background: #fff5f5;
            border: 1px solid #dc3545;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 18px;
        }
        .errors ul {
            list-style: none;
            color: #dc3545;
            font-size: 13px;
        }
        .errors li {
            margin-bottom: 4px;
        }
        .parent-section {
            display: none;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 12px;
            margin-bottom: 5px;
        }
        .parent-section.visible {
            display: block;
        }
        .parent-section-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .parent-note {
            font-size: 12px;
            color: #666;
            margin-bottom: 12px;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .radio-option input[type="radio"] {
            width: auto;
        }
        .skip-link {
            text-align: center;
            margin-top: 15px;
        }
        .skip-link a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }
        .skip-link a:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
            text-align: center;
        }
        .footer a {
            color: rgb(34, 139, 34);
            text-decoration: none;
        }
        @media (max-width: 500px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 25px;
            }
            .radio-group {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SDLL</div>
        <h1>Tell Us About Yourself</h1>
        <p class="subtitle">A few quick questions to help us get you started</p>

        {% if errors %}
        <div class="errors">
            <ul>
                {% for error in errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('umpire_academy.profile') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="birth_date">Date of Birth <span class="optional">(optional)</span></label>
                <input type="date" id="birth_date" name="birth_date"
                       value="{{ form_data.get('birth_date') or (profile.birth_date.strftime('%Y-%m-%d') if profile.birth_date else '') }}"
                       onchange="checkAge()">
            </div>

            <div id="parent-section" class="parent-section">
                <div class="parent-section-title">Parent/Guardian Info</div>
                <p class="parent-note">Required for umpires under 18</p>

                <div class="form-row">
                    <div class="form-group">
                        <label for="parent_first_name">Parent First Name</label>
                        <input type="text" id="parent_first_name" name="parent_first_name"
                               value="{{ form_data.get('parent_first_name', '') }}">
                    </div>
                    <div class="form-group">
                        <label for="parent_last_name">Parent Last Name</label>
                        <input type="text" id="parent_last_name" name="parent_last_name"
                               value="{{ form_data.get('parent_last_name', '') }}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="parent_email">Parent Email</label>
                    <input type="email" id="parent_email" name="parent_email"
                           value="{{ form_data.get('parent_email', '') }}">
                </div>

                <div class="form-group">
                    <label for="parent_phone">Parent Phone <span class="optional">(optional)</span></label>
                    <input type="tel" id="parent_phone" name="parent_phone"
                           value="{{ form_data.get('parent_phone', '') }}">
                </div>
            </div>

            <div class="form-group">
                <label>What sports are you interested in?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="interested_sports" value="both"
                               {{ 'checked' if form_data.get('interested_sports') == 'both' or not form_data.get('interested_sports') }}>
                        Both
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="interested_sports" value="baseball"
                               {{ 'checked' if form_data.get('interested_sports') == 'baseball' }}>
                        Baseball only
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="interested_sports" value="softball"
                               {{ 'checked' if form_data.get('interested_sports') == 'softball' }}>
                        Softball only
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="seasons_played">LL Seasons Played <span class="optional">(optional)</span></label>
                    <select id="seasons_played" name="seasons_played">
                        <option value="">-</option>
                        <option value="0" {{ 'selected' if form_data.get('seasons_played') == '0' }}>0</option>
                        <option value="1" {{ 'selected' if form_data.get('seasons_played') == '1' }}>1</option>
                        <option value="2" {{ 'selected' if form_data.get('seasons_played') == '2' }}>2</option>
                        <option value="3" {{ 'selected' if form_data.get('seasons_played') == '3' }}>3</option>
                        <option value="4" {{ 'selected' if form_data.get('seasons_played') == '4' }}>4</option>
                        <option value="5" {{ 'selected' if form_data.get('seasons_played') == '5' }}>5+</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="shirt_size">Shirt Size <span class="optional">(optional)</span></label>
                    <select id="shirt_size" name="shirt_size">
                        <option value="">-</option>
                        <option value="YS" {{ 'selected' if form_data.get('shirt_size') == 'YS' }}>Youth S</option>
                        <option value="YM" {{ 'selected' if form_data.get('shirt_size') == 'YM' }}>Youth M</option>
                        <option value="YL" {{ 'selected' if form_data.get('shirt_size') == 'YL' }}>Youth L</option>
                        <option value="AS" {{ 'selected' if form_data.get('shirt_size') == 'AS' }}>Adult S</option>
                        <option value="AM" {{ 'selected' if form_data.get('shirt_size') == 'AM' }}>Adult M</option>
                        <option value="AL" {{ 'selected' if form_data.get('shirt_size') == 'AL' }}>Adult L</option>
                        <option value="AXL" {{ 'selected' if form_data.get('shirt_size') == 'AXL' }}>Adult XL</option>
                        <option value="A2XL" {{ 'selected' if form_data.get('shirt_size') == 'A2XL' }}>Adult 2XL</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="availability_notes">Anything else we should know? <span class="optional">(optional)</span></label>
                <textarea id="availability_notes" name="availability_notes"
                          placeholder="Availability, experience, questions, etc.">{{ form_data.get('availability_notes', '') }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Finish</button>
        </form>

        <div class="footer">
            <p>South Durham Little League</p>
            <p><a href="https://southdurhamlittleleague.org">southdurhamlittleleague.org</a></p>
        </div>
    </div>

    <script>
        function checkAge() {
            var birthDate = document.getElementById('birth_date').value;
            var parentSection = document.getElementById('parent-section');

            if (birthDate) {
                var today = new Date();
                var birth = new Date(birthDate);
                var age = today.getFullYear() - birth.getFullYear();
                var monthDiff = today.getMonth() - birth.getMonth();

                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
                    age--;
                }

                if (age < 18) {
                    parentSection.classList.add('visible');
                } else {
                    parentSection.classList.remove('visible');
                }
            } else {
                parentSection.classList.remove('visible');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkAge();
        });
    </script>
</body>
</html>
