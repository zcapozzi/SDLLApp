<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Account - SDLL Umpire Academy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, rgb(34, 139, 34) 0%, rgb(28, 112, 28) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: rgb(34, 139, 34);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .phase-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            gap: 8px;
        }
        .phase {
            width: 30px;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
        }
        .phase.active {
            background: rgb(34, 139, 34);
        }
        .phase.completed {
            background: rgb(34, 139, 34);
        }
        .welcome-box {
            background: #e8f5e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .welcome-box p {
            color: #333;
            font-size: 15px;
            margin: 0;
        }
        .welcome-box strong {
            color: rgb(34, 139, 34);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: rgb(34, 139, 34);
            box-shadow: 0 0 0 3px rgba(34, 139, 34, 0.1);
        }
        input[readonly] {
            background: #f8f9fa;
            color: #666;
        }
        .required::after {
            content: ' *';
            color: #dc3545;
        }
        .password-hint {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary {
            background: rgb(34, 139, 34);
            color: white;
        }
        .btn-primary:hover {
            background: rgb(28, 112, 28);
            transform: translateY(-1px);
        }
        .errors {
            background: #fff5f5;
            border: 1px solid #dc3545;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .errors ul {
            list-style: none;
            color: #dc3545;
            font-size: 14px;
        }
        .errors li {
            margin-bottom: 5px;
        }
        .errors li:last-child {
            margin-bottom: 0;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
            text-align: center;
        }
        .footer a {
            color: rgb(34, 139, 34);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SDLL</div>
        <h1>Set Up Your Account</h1>
        <p class="subtitle">Almost there! Create your password to continue.</p>

        <div class="phase-indicator">
            <div class="phase completed"></div>
            <div class="phase active"></div>
            <div class="phase"></div>
        </div>

        <div class="welcome-box">
            <p>Welcome, <strong>{{ profile.first_name }}</strong>!</p>
        </div>

        {% if errors %}
        <div class="errors">
            <ul>
                {% for error in errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('umpire_academy.complete_registration', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="{{ profile.umpire_email or '' }}" readonly>
            </div>

            <div class="form-group">
                <label for="password" class="required">Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                       placeholder="Create a password">
                <p class="password-hint">Minimum 8 characters</p>
            </div>

            <div class="form-group">
                <label for="confirm" class="required">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required minlength="8"
                       placeholder="Re-enter your password">
            </div>

            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <div class="footer">
            <p>South Durham Little League</p>
            <p><a href="https://southdurhamlittleleague.org">southdurhamlittleleague.org</a></p>
        </div>
    </div>
</body>
</html>
